<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fuda collection views</title><style>body{margin:0;background:#14151d;color:#f5f2eb;font:16px system-ui}main{max-width:1100px;margin:auto;padding:1rem}h1{font-size:1.6rem}p{color:#c7c4ce}label{display:block;margin:1rem 0}input{font:inherit}</style></head><body><main><h1>Fuda collection views</h1><p>Choose a display, browse the cards, and select one to inspect it. The atlas can be dragged and zoomed. Sample images come from TCGdex and Hako Devices.</p><label>Demo user: <select id="demo-user" aria-label="Demo user"></select></label><p id="demo-collection"></p><label>Load your collection (JSON): <input type="file" id="file" accept=".json,application/json"></label><label>Saved collection: <select id="saved"><option value="">Choose a collection</option></select> <button id="save" type="button">Save current collection</button> <button id="load" type="button">Load</button></label><p id="status" role="status"></p><fuda-collection></fuda-collection></main><script type="module">
import '../dist/collection-element.js';
import {demoUsers} from './users.js';
const viewer=document.querySelector('fuda-collection');
const userSelect=document.querySelector('#demo-user');
for (const user of demoUsers) userSelect.add(new Option(user.name,user.id));
function selectUser(){const user=demoUsers.find(item=>item.id===userSelect.value);if(!user)return;viewer.cards=user.cards;document.querySelector('#demo-collection').textContent=`${user.name}’s collection: ${user.collection} · ${user.cards.length} cards`;document.querySelector('#status').textContent='Demo user selected.';}
userSelect.addEventListener('change',selectUser);
selectUser();
const storageKey='fuda-demo-collections-v1';const status=document.querySelector('#status'),saved=document.querySelector('#saved');function readSaved(){try{const value=JSON.parse(localStorage.getItem(storageKey)||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}catch{return {}}}function updateSaved(selected=''){const data=readSaved();saved.replaceChildren(new Option('Choose a collection',''));Object.keys(data).sort().forEach(name=>saved.add(new Option(name,name)));saved.value=selected}updateSaved();document.querySelector('#save').onclick=()=>{const name=prompt('Name this collection:');if(!name||!name.trim())return;try{let all=readSaved();all[name.trim()]=viewer.cards;localStorage.setItem(storageKey,JSON.stringify(all));updateSaved(name.trim());status.textContent='Collection saved in this browser.'}catch(error){status.textContent=`Could not save collection: ${error.message}`}};document.querySelector('#load').onclick=()=>{if(!saved.value){status.textContent='Choose a saved collection first.';return}try{viewer.cards=readSaved()[saved.value];status.textContent=`Loaded ${saved.value}.`}catch(error){status.textContent=`Could not load collection: ${error.message}`}};document.querySelector('#file').onchange=async e=>{try{viewer.cards=JSON.parse(await e.target.files[0].text());document.querySelector('#status').textContent=`Loaded ${viewer.cards.length} cards.`}catch(error){document.querySelector('#status').textContent=`Could not load collection: ${error.message}`}};
</script></body></html>
