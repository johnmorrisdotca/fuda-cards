<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fuda collection views</title><style>body{margin:0;background:#14151d;color:#f5f2eb;font:16px system-ui}main{max-width:1100px;margin:auto;padding:1rem}h1{font-size:1.6rem}p{color:#c7c4ce}label{display:block;margin:1rem 0}input{font:inherit}</style></head><body><main><p><a href="../index.html" style="color:#e1c082">← Card studio</a></p><h1>Fuda collection views</h1><p>Choose a display, browse the cards, and select one to inspect it. The atlas can be dragged and zoomed. Sample images come from TCGdex and Hako Devices.</p><label>Demo user: <select id="demo-user" aria-label="Demo user"></select></label><p id="demo-collection"></p><label>Load your collection (JSON): <input type="file" id="file" accept=".json,application/json"></label><label>Saved collection: <select id="saved"><option value="">Choose a collection</option></select> <button id="save" type="button">Save current collection</button> <button id="load" type="button">Load</button> <button id="delete" type="button">Delete</button> <button id="legacy" type="button">Import older saved collections</button> <button id="export" type="button">Export current collection</button></label><p id="status" role="status"></p><fuda-collection></fuda-collection></main><script type="module">
import '../dist/collection-element.js';
import {demoUsers} from './users.js';
import {listCollections,saveCollection,deleteCollection,importLegacy} from './storage.js';
const viewer=document.querySelector('fuda-collection');
const userSelect=document.querySelector('#demo-user');
for (const user of demoUsers) userSelect.add(new Option(user.name,user.id));
function selectUser(){const user=demoUsers.find(item=>item.id===userSelect.value);if(!user)return;viewer.cards=user.cards;document.querySelector('#demo-collection').textContent=`${user.name}’s collection: ${user.collection} · ${user.cards.length} cards`;document.querySelector('#status').textContent='Demo user selected.';updateSaved();}
userSelect.addEventListener('change',selectUser);
const status=document.querySelector('#status'),saved=document.querySelector('#saved');
function updateSaved(selected=''){try{const data=listCollections(localStorage,userSelect.value);saved.replaceChildren(new Option('Choose a collection',''));Object.keys(data).sort().forEach(name=>saved.add(new Option(name,name)));saved.value=selected}catch(error){saved.replaceChildren(new Option('Choose a collection',''));status.textContent=`Could not read collections: ${error.message}`}}
selectUser();
document.querySelector('#save').onclick=()=>{const name=prompt('Name this collection:');if(!name||!name.trim())return;try{const trimmed=name.trim();const all=listCollections(localStorage,userSelect.value);if(Object.hasOwn(all,trimmed)&&!confirm(`Replace “${trimmed}”?`))return;saveCollection(localStorage,userSelect.value,trimmed,viewer.cards);updateSaved(trimmed);status.textContent='Collection saved for this demo user in this browser.'}catch(error){status.textContent=`Could not save collection: ${error.message}`}};
document.querySelector('#load').onclick=()=>{if(!saved.value){status.textContent='Choose a saved collection first.';return}try{viewer.cards=listCollections(localStorage,userSelect.value)[saved.value];document.querySelector('#demo-collection').textContent=`Saved collection: ${saved.value} · ${viewer.cards.length} cards`;status.textContent=`Loaded ${saved.value}.`}catch(error){status.textContent=`Could not load collection: ${error.message}`}};
document.querySelector('#delete').onclick=()=>{const name=saved.value;if(!name){status.textContent='Choose a saved collection first.';return}if(!confirm(`Delete “${name}” from this demo user?`))return;try{deleteCollection(localStorage,userSelect.value,name);updateSaved();status.textContent=`Deleted ${name}.`}catch(error){status.textContent=`Could not delete collection: ${error.message}`}};
document.querySelector('#legacy').onclick=()=>{try{const count=importLegacy(localStorage,userSelect.value);updateSaved();status.textContent=`Imported ${count} older collections. Existing names were kept.`}catch(error){status.textContent=`Could not import older collections: ${error.message}`}};
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(viewer.cards,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='fuda-collection.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),0)};
document.querySelector('#file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{viewer.cards=JSON.parse(await file.text());document.querySelector('#demo-collection').textContent=`Imported collection · ${viewer.cards.length} cards`;status.textContent=`Loaded ${viewer.cards.length} cards.`}catch(error){status.textContent=`Could not load collection: ${error.message}`}finally{e.target.value=''}};
</script></body></html>
