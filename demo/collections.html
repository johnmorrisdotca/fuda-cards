<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fuda collection views</title><style>
:root{font-family:system-ui;color:#f5f1e8;background:#14151d}*{box-sizing:border-box}body{margin:0}header{padding:1rem max(1rem,4vw);display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;background:#20212d}h1{font-size:1.25rem;margin:0 auto 0 0}select,button,input{font:inherit}button,select,.upload{background:#353747;color:white;border:1px solid #65677a;border-radius:.5rem;padding:.6rem .8rem;cursor:pointer}button:hover{background:#565972}button:focus-visible,select:focus-visible{outline:3px solid #ffd27e}main{padding:1rem;text-align:center}p{color:#c6c5d1}#stage{height:min(65vh,650px);min-height:310px;position:relative;overflow:auto;background:radial-gradient(ellipse at center,#454054,#242431 65%,#171822);border:1px solid #555262;border-radius:1rem;touch-action:pan-y}.card{padding:0;border:0;background:none;position:relative;display:inline-block;vertical-align:middle;transition:transform .3s;line-height:0}.card img{width:100%;height:100%;object-fit:contain;border-radius:5%;box-shadow:0 8px 20px #0009}.card:focus-visible{outline:3px solid #ffd27e}.deck .card,.rolodex .card,.tower .card,.spotlight .card,.jukebox .card,.random .card,.story .card{position:absolute;width:min(55vw,290px);height:85%;top:7.5%;left:50%;transform:translateX(-50%)}.binder,.case,.atlas,.wall{padding:1rem}.binder,.case{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-content:start}.binder .card,.case .card{width:100%;height:clamp(120px,25vw,240px)}.case{perspective:800px;background:linear-gradient(#453e34,#1a1917)!important}.case .card{transform:perspective(500px) rotateX(-16deg)}.wall{display:flex;gap:1rem;align-items:center}.wall .card{flex:0 0 180px;height:80%}.atlas{display:grid;grid-template-columns:repeat(5,140px);gap:20px;width:max-content;min-width:100%;transform-origin:top left}.atlas .card{height:195px}.controls{display:flex;justify-content:center;align-items:center;gap:.7rem;flex-wrap:wrap;margin:1rem}.controls span{min-width:5rem}.hidden{display:none}dialog{background:#252632;color:white;border:1px solid #777;border-radius:1rem;max-width:95vw;max-height:95vh;text-align:center}dialog img{display:block;height:min(70vh,620px);max-width:85vw;object-fit:contain;margin:1rem auto}#hint{min-height:2.5em}.upload input{position:absolute;opacity:0;width:1px} @media(max-width:500px){.binder,.case{grid-template-columns:repeat(2,minmax(0,1fr))}.deck .card,.rolodex .card,.tower .card,.spotlight .card,.jukebox .card,.random .card,.story .card{width:min(68vw,300px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><header><h1>Fuda · Collection views</h1><label>View <select id="mode"></select></label><label class="upload">Load JSON<input type="file" id="file" accept="application/json,.json"></label></header><main><p id="hint"></p><div id="stage" tabindex="0" aria-label="Card collection"></div><div class="controls"><button id="prev" aria-label="Previous">← Previous</button><span id="count" aria-live="polite"></span><button id="next" aria-label="Next">Next →</button><button id="draw" class="hidden">Draw a card</button><label id="zoomWrap" class="hidden">Zoom <input id="zoom" type="range" min="0.5" max="2" step="0.1" value="1"></label></div><p id="status">Sample card images are loaded from TCGdex. Select a card to inspect it.</p></main><dialog id="detail"><button id="close">Close</button><img id="detailImg" alt=""><div id="detailName"></div></dialog><script>
const views=[['deck','Overlapping Deck','Swipe left or right to browse the deck.'],['rolodex','Rolodex','Browse the rotating card index.'],['binder','Binder Pages','Browse pages and select a card.'],['case','Convention Display Case','Explore angled rows and select a card.'],['jukebox','Jukebox Carousel','Browse the cards in the jukebox.'],['random','Random Draw','Draw a surprise card.'],['story','Vertical Story Scroll','Scroll through large cards vertically.'],['wall','Sliding Gallery Wall','Scroll sideways along the gallery.'],['tower','Flip Tower','Flip through the upright stack.'],['spotlight','Spotlight Carousel','Rotate the spotlight to another card.'],['atlas','Infinite Card Atlas','Pan around the card plane and use the zoom slider.']];
let cards=[['Charizard','4'],['Blastoise','2'],['Venusaur','15'],['Alakazam','1'],['Chansey','3'],['Clefairy','5'],['Gyarados','6'],['Hitmonchan','7'],['Machamp','8'],['Magneton','9'],['Mewtwo','10'],['Nidoking','11']].map(([name,id])=>({name,image:`https://assets.tcgdex.net/en/base/base1/${id}/low.webp`}));let index=0;const $=s=>document.querySelector(s),stage=$('#stage'),mode=$('#mode');views.forEach(([v,n])=>mode.add(new Option(n,v)));function card(c,i){const b=document.createElement('button');b.className='card';b.setAttribute('aria-label',`Open ${c.name}`);const img=document.createElement('img');img.src=c.image;img.alt=c.name;img.onerror=()=>{img.alt=`Image unavailable: ${c.name}`};b.append(img);b.onclick=()=>{index=i;$('#detailImg').src=c.image;$('#detailImg').alt=c.name;$('#detailName').textContent=c.name;$('#detail').showModal()};return b}function render(){const v=mode.value;stage.className=v;stage.replaceChildren();$('#hint').textContent=views.find(x=>x[0]===v)[2];$('#draw').classList.toggle('hidden',v!=='random');$('#zoomWrap').classList.toggle('hidden',v!=='atlas');$('#count').textContent=cards.length?`${index+1} / ${cards.length}`:'No cards';if(!cards.length){stage.textContent='No cards in this collection.';return}if(['binder','case'].includes(v)){const size=6,start=Math.floor(index/size)*size;cards.slice(start,start+size).forEach((c,i)=>stage.append(card(c,start+i)))}else if(['atlas','wall','story'].includes(v)){if(v==='story'){stage.className='wall';stage.style.flexDirection='column';stage.style.overflow='auto';cards.forEach((c,i)=>{let b=card(c,i);b.style.flex='0 0 80%';b.style.width='min(65vw,300px)';stage.append(b)})}else{stage.style.flexDirection='';cards.forEach((c,i)=>stage.append(card(c,i)))}if(v==='atlas')stage.style.gridTemplateColumns=`repeat(5,${140*Number($('#zoom').value)}px)`}else{stage.style.flexDirection='';for(let d=2;d>=0;d--){let i=(index+d)%cards.length,b=card(cards[i],i);if(d){b.style.transform=`translateX(calc(-50% + ${d*14}px)) rotate(${d*5}deg) scale(${1-d*.045})`;b.style.opacity='.7'}if(v==='rolodex'&&d)b.style.transform=`translateX(calc(-50% + ${d*45}px)) rotate(${d*12}deg) scale(${1-d*.13})`;if(v==='tower'&&d)b.style.transform=`translate(-50%, ${d*14}px) scale(${1-d*.06})`;if(v==='spotlight'&&d)b.style.transform=`translateX(calc(-50% + ${d*80}px)) scale(${1-d*.2})`;stage.append(b)}}}function move(delta){if(!cards.length)return;let step=['binder','case'].includes(mode.value)?6:1;index=(index+delta*step+cards.length)%cards.length;render()}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#draw').onclick=()=>{if(cards.length>1){let n;do n=Math.floor(Math.random()*cards.length);while(n===index);index=n;render()}};mode.onchange=()=>{index=0;stage.scrollTo(0,0);render()};$('#zoom').oninput=render;$('#close').onclick=()=>$('#detail').close();document.addEventListener('keydown',e=>{if($('#detail').open)return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let x;stage.addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(!['deck','rolodex','jukebox','tower','spotlight'].includes(mode.value))return;let dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>45)move(dx<0?1:-1)},{passive:true});$('#file').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(c=>c&&typeof c.name==='string'&&typeof c.image==='string'))throw Error('Expected an array of objects with name and image strings.');cards=data;index=0;$('#status').textContent=`Loaded ${cards.length} cards.`;render()}catch(err){$('#status').textContent=`Could not load JSON: ${err.message}`}};render();
</script></body></html>
