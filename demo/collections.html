<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>fuda-card:where(:not(:defined)){display:inline-block;width:300px;aspect-ratio:2.5/3.5;overflow:hidden;visibility:hidden}fuda-collection:where(:not(:defined)){display:block;min-height:calc(var(--fuda-stage-height,clamp(300px,calc(100svh - 440px),620px)) + 380px)}</style><title>Fuda collection views</title><style>body{margin:0;background:#14151d;color:#f5f2eb;font:16px system-ui}main{max-width:1100px;margin:auto;padding:1rem}h1{font-size:1.4rem;margin:.2rem 0}p{color:#c7c4ce;margin:.3rem 0 .7rem}a{color:#e1c082}label{display:block;margin:1rem 0}input{font:inherit}</style></head><body><main><h1>Fuda · Collection views</h1><p><a href="collections-component.html">Full demo with profiles and saved collections</a> · Zoom, Fit and move work in every view.</p><fuda-collection address></fuda-collection><label>Load JSON: <input type="file" id="file" accept="application/json,.json"></label><p id="status" role="status"></p></main><script type="importmap">{"imports":{"@johnmorrisdotca/kazoku-ui/view-controls/define":"../node_modules/@johnmorrisdotca/kazoku-ui/dist/view-controls/define.js"}}</script><script type="module">
import '../dist/collection-element.js';
const viewer=document.querySelector('fuda-collection'),status=document.querySelector('#status');
viewer.cards=[['Charizard','4'],['Blastoise','2'],['Venusaur','15'],['Alakazam','1'],['Chansey','3'],['Clefairy','5'],['Gyarados','6'],['Hitmonchan','7'],['Machamp','8'],['Magneton','9'],['Mewtwo','10'],['Nidoking','11']].map(([name,id])=>({id:`base1-${id}`,name,image:`https://assets.tcgdex.net/en/base/base1/${id}/low.webp`}));
