<!doctype html>
<!-- The Builder's source: see demo/index.html for how the "family:" lines are filled. -->
<html lang="en">
  <head>
    <!-- family:head -->
    <style>fuda-card:where(:not(:defined)){display:inline-block;width:300px;aspect-ratio:2.5/3.5;overflow:hidden;visibility:hidden}fuda-collection:where(:not(:defined)){display:block;min-height:calc(var(--fuda-stage-height,clamp(300px,calc(100svh - 440px),620px)) + 380px)}</style>
    <!-- family:icon -->
    <link rel="stylesheet" href="demo/family.css" />
    <link rel="stylesheet" href="demo/studio.css" />
    <!-- family:importmap -->
  </head>
  <body>
    <main>
      <!-- family:header -->
      <div class="studio builder">
        <div class="studio-side">
          <section class="fam-felt studio-felt" aria-labelledby="bld-preview-title">
            <h2 class="fam-sr" id="bld-preview-title" data-say="previewTitle"></h2>
            <div class="builder-stage" id="bld-stage" data-testid="bld-stage" aria-live="polite"></div>
            <p class="fam-hint" id="bld-note" data-testid="bld-note"></p>
          </section>
          <div class="fam-actions">
            <button class="fam-button" id="bld-link" type="button" data-say="copyLink" data-testid="bld-link"></button>
            <button class="fam-button" id="bld-reset" type="button" data-say="startAgain" data-testid="bld-reset"></button>
          </div>
          <p class="fam-fine" id="bld-copied" aria-live="polite"></p>
        </div>
        <div class="studio-side">
          <div class="fam-panel">
            <div class="fam-seg" id="bld-makers" role="group" data-say-label="makerLabel" data-testid="bld-makers">
              <button type="button" data-maker="card" data-say="makerCard"></button>
              <button type="button" data-maker="collection" data-say="makerCollection"></button>
            </div>
            <p class="fam-muted" id="bld-maker-says" data-testid="bld-maker-says"></p>
          </div>
          <div class="fam-panels" id="controls" data-testid="controls"></div>
        </div>
      </div>
      <section class="more builder-code" aria-labelledby="bld-code-title">
        <h2 id="bld-code-title" data-say="codeTitle"></h2>
        <p data-say="codeText"></p>
        <div class="fam-tabs" role="tablist" id="bld-formats" data-testid="bld-formats"></div>
        <div id="bld-panel" role="tabpanel" data-testid="bld-panel">
          <pre><code id="bld-code" data-testid="bld-code"></code></pre>
          <div class="fam-actions"><button class="fam-button" data-primary="true" id="bld-copy" type="button" data-say="copy" data-testid="bld-copy"></button></div>
          <p class="fam-fine" id="bld-code-copied" aria-live="polite"></p>
        </div>
      </section>
      <!-- family:unreviewed -->
      <!-- family:footer -->
    </main>
    <!-- family:script -->
    <script type="module" src="demo/builder.js"></script>
  </body>
</html>
