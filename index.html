<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fuda — Card Studio</title><style>body{margin:0;background:#10151e;color:#f3f0e9;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:40px 24px}h1{font:48px Georgia;margin:5px 0}p{color:#aeb9c4;line-height:1.5}header{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.tag{color:#d8b77d;letter-spacing:.22em;font-size:11px;font-weight:bold}.layout{display:grid;grid-template-columns:1fr 340px;gap:45px;margin-top:36px}.stage{min-height:520px;display:grid;place-items:center;background:radial-gradient(ellipse,#334250,#171e29 65%);border:1px solid #35404a;border-radius:16px;padding:30px}.controls{display:grid;gap:14px;align-content:start}label{display:grid;gap:6px;color:#c5ccd1;font-size:12px;font-weight:bold}input,select,textarea,button{font:inherit;border-radius:7px;border:1px solid #46515b;padding:10px;background:#202a35;color:white}button{cursor:pointer;background:#d3b276;color:#171717;border:0;font-weight:bold}button:hover{background:#f0d094}.note{font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.stage{min-height:450px}h1{font-size:38px}}</style></head><body><main><header><div><div class="tag">FUDA / CARD STUDIO</div><h1>Make it collectible.</h1><p>A frame for the things you want to show off.</p></div><nav aria-label="Demos"><a href="demo/collections-component.html" style="color:#e1c082">Explore collection views →</a> &nbsp; <a href="demo/tcgdex.html" style="color:#e1c082">Explore the Pokémon binder →</a></nav></header><div class="layout"><section class="stage" aria-label="Card preview"><fuda-card id="card" motion="pan" title="Starship Block 3" category="ROCKET" subtitle="Starship + Super Heavy" description="Height: 124.4 m · Diameter: 9 m · 33 Raptor 3 booster engines." number="NO. 001" rarity="✦ RARE"><img id="art" alt="Starship Block 3 from Uchusen Rockets" src="assets/starship-v3-preview.jpg"></fuda-card></section><section class="controls" aria-label="Card controls"><label>Card style<select id="variant"><option value="classic">Classic collectible</option><option value="sport">Silver sport</option><option value="cosmic">Cosmic violet</option></select></label><label>Finish<select id="finish"><option value="foil">Foil</option><option value="matte">Matte</option></select></label><label>Image motion<select id="motion"><option value="pan">Pan vertically</option><option value="still">Still</option></select></label><label>Starting view<select id="initial-motion"><option value="still">Focused still</option><option value="playing">Animated</option></select></label><label>Pan direction<select id="pan-direction"><option value="down">Top to bottom</option><option value="up">Bottom to top</option></select></label><label>Card rotation<select id="card-spin"><option value="off">Off</option><option value="center">Rotate around center</option><option value="corner">Spin around bottom corner</option></select></label><label>Rotation speed<select id="spin-speed"><option value="180s">Slow (3 minutes per turn)</option><option value="30s">Medium (30 seconds)</option><option value="8s">Fast (8 seconds)</option></select></label><label>Rotation direction<select id="card-spin-direction"><option value="normal">Forward</option><option value="reverse">Reverse</option></select></label><button id="pause-spin" type="button" disabled aria-pressed="false">Pause card rotation</button><label>Title<input id="title" value="Starship Block 3"></label><label>Category<input id="category" value="ROCKET"></label><label>Subtitle<input id="subtitle" value="Starship + Super Heavy"></label><label>Description<textarea id="description" rows="3">Height: 124.4 m · Diameter: 9 m · 33 Raptor 3 booster engines.</textarea></label><label>Image<input id="upload" type="file" accept="image/*"></label><button id="flip" type="button">Flip card</button><p class="note">Choose an image to preview your own content. Files stay in this browser session. Card rotation stops when your device requests reduced motion.</p></section></div></main><script type="module">import './dist/element.js';const card=document.querySelector('#card');for(const id of ['variant','finish','motion','pan-direction','title','category','subtitle','description']){const el=document.getElementById(id);el.addEventListener('input',()=>card.setAttribute(id,el.value));}document.querySelector('#initial-motion').addEventListener('change',e=>card.toggleAttribute('playing',e.target.value==='playing'));const spinSelect=document.querySelector('#card-spin'),pauseSpin=document.querySelector('#pause-spin');spinSelect.addEventListener('change',()=>{if(spinSelect.value==='off'){card.removeAttribute('card-spin');card.removeAttribute('card-spin-paused')}else card.setAttribute('card-spin',spinSelect.value);pauseSpin.disabled=spinSelect.value==='off';pauseSpin.setAttribute('aria-pressed',String(card.hasAttribute('card-spin-paused')));pauseSpin.textContent=card.hasAttribute('card-spin-paused')?'Resume card rotation':'Pause card rotation'});pauseSpin.addEventListener('click',()=>{const paused=card.toggleAttribute('card-spin-paused');pauseSpin.setAttribute('aria-pressed',String(paused));pauseSpin.textContent=paused?'Resume card rotation':'Pause card rotation'});document.querySelector('#spin-speed').addEventListener('change',e=>card.style.setProperty('--fuda-card-spin-duration',e.target.value));document.querySelector('#card-spin-direction').addEventListener('change',e=>card.setAttribute('card-spin-direction',e.target.value));document.querySelector('#flip').addEventListener('click',()=>card.toggleAttribute('flipped'));let url;document.querySelector('#upload').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);const art=document.querySelector('#art');art.src=url;art.alt=file.name;});</script></body></html>
